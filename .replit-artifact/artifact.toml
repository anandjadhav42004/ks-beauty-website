kind = "web"
previewPath = "/"
title = "KS Beauty"
version = "1.0.0"
id = "artifacts/ks-beauty"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23158

[services.development]
run = "pnpm --filter @workspace/ks-beauty run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ks-beauty", "run", "build" ]
serve = "static"
publicDir = "artifacts/ks-beauty/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23158"
BASE_PATH = "/"
